[package]
name = "flecs-c"
description = "Flecs's amalgamated C (vendor/flecs) built with cc for the host and for wasm32-unknown-unknown, plus the declarations Rust calls it through. With `host`, links the application's Flecs (flecs_ecs_sys) instead."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
links = "flecs"

[features]
# Link the host application's Flecs instead of compiling one: only csrc/glue.c is compiled, and the ecs_* symbols come
# from flecs_ecs_sys (crates/flecs_ecs_sys, built from the same vendor/flecs/distr), so the process has one Flecs
# (SPEC.md, "Host worlds").
host = ["dep:flecs_ecs_sys"]
# Native only: Flecs's REST API (and the HTTP, JSON and pipeline addons it needs) and `glue_rest_*`, a read-only REST
# server a host feeds requests to. wasm32 and host builds refuse it (build.rs).
rest = []

[dependencies]
flecs_ecs_sys = { path = "../flecs_ecs_sys", optional = true, default-features = false, features = ["flecs_meta_c"] }

[build-dependencies]
cc = "1"
sha2 = "0.10"
