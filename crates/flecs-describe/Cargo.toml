[package]
name = "flecs-describe"
description = "Describe Rust types (#[derive(Describe)]) to flecs-snapshot: one description gives the layout record, the snapshot value and the Flecs meta (SPEC.md, \"Described types\")."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
# Link the host application's Flecs (forwards to flecs-c/host).
host = ["flecs-c/host"]
glam = ["dep:glam"]
# glamx's poses and 2D rotations (rapier, parry); its Quat and vectors are glam's.
glamx = ["dep:glamx", "glam"]
half = ["dep:half"]
bitflags = ["dep:bitflags"]
# flecs_ecs brings its own Flecs (flecs_ecs_sys), so it implies `host`: one Flecs per process.
flecs_ecs = ["dep:flecs_ecs", "host"]

[dependencies]
flecs-c = { path = "../flecs-c" }
flecs-snapshot = { path = "../flecs-snapshot" }
flecs-describe-derive = { path = "../flecs-describe-derive" }
ipld-core = "0.4"
# the registry of derived types (`DESCRIBED`), so a host describes every registered component in one call
# (`describe_all`) without a call at each registration site.
linkme = "0.3.36"
serde_ipld_dagcbor = "0.7"
glam = { version = "0.33", optional = true }
glamx = { version = "0.3", optional = true, default-features = false, features = ["std", "f64"] }
half = { version = "2", optional = true }
bitflags = { version = "2", optional = true }
flecs_ecs = { path = "../flecs_ecs", optional = true }
