# A separate workspace that checks host mode: an application on flecs_ecs (crates/flecs_ecs, whose flecs_ecs_sys
# compiles vendor/flecs/distr) with flecs-snapshot's `host`, so the process has one Flecs. Separate so that `host`
# (feature unification) never reaches the main workspace's own builds of flecs-c.
[workspace]

[package]
name = "host-check"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
flecs_ecs = { path = "../crates/flecs_ecs" }
flecs-snapshot = { path = "../crates/flecs-snapshot", features = ["host"] }
flecs-describe = { path = "../crates/flecs-describe", features = ["flecs_ecs", "glam"] }
glam = "0.33"
ipld-core = "0.4"
serde_ipld_dagcbor = "0.7"
zstd = "0.13"
