# A separate workspace that checks host mode against the space game's Flecs: flecs_ecs and flecs_ecs_sys at the
# game's rev, flecs_ecs_sys patched to vendor/flecs_ecs_sys as the game patches its copy, and flecs-snapshot with
# `host` so the process has one Flecs. The main workspace never builds flecs_ecs_sys.
[workspace]

[package]
name = "host-check"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
flecs_ecs = { git = "https://github.com/Indra-db/Flecs-Rust", rev = "bf956db99b69d41ee142c9d52054911af28d7e93" }
flecs-snapshot = { path = "../crates/flecs-snapshot", features = ["host"] }
flecs-describe = { path = "../crates/flecs-describe", features = ["flecs_ecs", "glam"] }
glam = "0.30"
ipld-core = "0.4"
serde_ipld_dagcbor = "0.7"
zstd = "0.13"

[patch."https://github.com/Indra-db/Flecs-Rust"]
flecs_ecs_sys = { path = "../vendor/flecs_ecs_sys" }
